name: Docker build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build --build-arg PYTHON_IMAGE=python:3.12-slim -t safety-code-pdf-generator .
